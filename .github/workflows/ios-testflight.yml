name: iPhone TestFlight build and submit
on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/e2e/**'
      - '!mobile/README.md'
      - '!mobile/src/**/*.test.ts'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check one-time Expo authentication setup
        shell: bash
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Add EXPO_TOKEN to this repository Actions secrets. Never put the token in code or logs.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile --no-audit --no-fund
      - run: npm --prefix mobile run typecheck
      - name: Build iOS and automatically submit to App Store Connect
        working-directory: mobile
        run: npx --yes eas-cli@27.4.1 build --platform ios --profile production --auto-submit --non-interactive --no-wait
      - name: Explain release status
        if: always()
        shell: bash
        run: |
          echo 'A green workflow means EAS accepted the build request, not that the iOS build or Apple submission finished. Check EAS links. Apple processing is separate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No public App Store release is performed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
