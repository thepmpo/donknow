<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>docen과 통화</title><style>body{font:16px/1.6 system-ui;margin:0;background:Canvas;color:CanvasText}main{height:100dvh;display:flex;flex-direction:column;max-width:760px;margin:auto;padding:20px;box-sizing:border-box}h1{font-size:22px;margin:8px 0}button,input{font:inherit;min-height:44px;border-radius:16px;border:1px solid #8886;padding:8px 14px;background:Canvas;color:CanvasText}button{cursor:pointer}#messages{flex:1;overflow:auto;min-height:0}p{padding:10px 14px;background:#8881;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}form{display:flex;gap:8px}input{flex:1;min-width:0}.tools{display:flex;gap:8px;margin:10px 0}#state{font-size:14px;color:#777}#error{color:#e44}</style><main><h1>🦆 docen과 통화</h1><div id="state" role="status">마이크를 허용하고 대화를 시작해주세요.</div><div class="tools"><button id="start">통화 시작</button><button id="mute" disabled>마이크 끄기</button><button id="end">통화 종료</button></div><div id="messages" aria-live="polite"></div><div id="error" role="alert"></div><form><input aria-label="통화 중 docen에게 입력" placeholder="통화 중에도 글로 이야기할 수 있어요" maxlength="2000"><button>보내기</button></form><audio autoplay></audio></main><script src="/agent-call.js"></script></html>
